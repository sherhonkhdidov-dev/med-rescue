<!DOCTYPE html><html lang="tg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MED RESCUE · Беморхона</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" onerror="this.href='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css'">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#0f1722}
#map{position:fixed;inset:0;background:#e8ebf0}
.top,.sheet,#al{position:fixed;z-index:1000;background:#fff;box-shadow:0 2px 14px #0004}
.top,#al{left:10px;right:10px;max-width:460px;border-radius:10px;padding:10px 12px}
.top{top:max(10px,env(safe-area-inset-top))}
#al{top:calc(max(10px,env(safe-area-inset-top)) + 100px);background:#b4232c;color:#fff;font-weight:600}
.sheet{left:0;right:0;bottom:0;max-height:46vh;overflow:auto;border-radius:14px 14px 0 0;padding:12px 14px calc(14px + env(safe-area-inset-bottom))}
small,.mu{display:block;color:#5b6675;font-size:12px}
input,button{font:inherit}
input{width:100%;border:1px solid #cfd5dd;border-radius:8px;padding:9px 10px;margin:6px 0}
.btn{border:0;border-radius:8px;padding:10px 14px;background:#b4232c;color:#fff;font-weight:600;cursor:pointer}.btn.o{background:#fff;color:#0f1722;border:1px solid #cfd5dd}
.lg{display:inline-block;width:16px;height:16px;border-radius:3px;margin-right:8px;vertical-align:-2px;background:linear-gradient(#fff,#fff) center/10px 3px no-repeat,linear-gradient(#fff,#fff) center/3px 10px no-repeat,#b4232c}
#ls{max-height:42vh;overflow:auto}#ls div{padding:10px 2px;border-top:1px solid #e6e9ee;cursor:pointer}#ls small{margin:0}#ls mark{background:#fde68a;color:inherit}#st{cursor:pointer}
.hx{width:34px;height:34px;display:grid;place-items:center;background:#fff;color:#b4232c;border:3px solid #b4232c;border-radius:8px;font:700 24px/1 system-ui;box-shadow:0 2px 8px #0005}
.am{display:flex;align-items:center;gap:6px;width:max-content;transform:translate(-14px,-14px);padding:3px 9px 3px 3px;border-radius:15px;background:#0f1722;color:#fff;font-weight:600;box-shadow:0 2px 8px #0006}
.am b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#b4232c}
.r{padding:8px 0;border-top:1px solid #e6e9ee}
.pc{border:1px solid #e0e4ea;border-left:4px solid #b4232c;border-radius:8px;padding:10px 12px;margin:8px 0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.g b{font-size:17px}
.pc img{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:8px;margin:8px 0}
.ck{display:block;padding:5px 0}.ck input{width:auto;margin:0 8px 0 0}
h4{margin:8px 0 2px;font-size:14px}
[hidden]{display:none!important}
</style></head>
<body><div id="map"></div>
<div class="top" id="t1"><b><i class="lg"></i>MED RESCUE · Беморхона</b><small id="st">Харита боргирӣ мешавад…</small><input id="q" placeholder="Номи беморхона ё як ҳарф нависед" autocomplete="off" enterkeyhint="search"><div id="ls"></div><button class="btn o" onclick="loc()" style="margin-top:6px">Мавқеи ман (GPS)</button><small>Муаллиф: Хидиров Шерхон · МТМУ №17</small></div>
<div class="top" id="t2" hidden><button class="btn o" id="bk">‹ Харитаи Тоҷикистон</button><br><b id="hn"></b><small id="hs">Пайвастшавӣ…</small></div>
<div id="al" hidden></div>
<div class="sheet" id="sh" hidden><h4>Мошинҳои ёрии таъҷилӣ дар хат</h4><div id="am"></div><h4>Беморони воридшаванда</h4><div id="pl"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script><script>window.L||document.write('<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"><\/script>')</script>
<script>
const $=i=>document.getElementById(i),J=JSON,LS=localStorage,esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),
km=(a,b,c,d)=>{const r=Math.PI/180,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 12742*Math.asin(Math.sqrt(x))},
BB=[[36.67,67.34],[41.05,75.15]],
nrm=s=>String(s||'').toLowerCase().replace(/ё/g,'е').replace(/ӣ/g,'и').replace(/ӯ/g,'у').replace(/ҳ/g,'х').replace(/қ/g,'к').replace(/ғ/g,'г').replace(/ҷ/g,'ч'),
ST=s=>$('st').textContent=s,
OVS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter'],
QQ='[out:json][timeout:60];area["ISO3166-1"="TJ"][admin_level=2]->.a;(nwr["amenity"="hospital"](area.a);nwr["healthcare"="hospital"](area.a);nwr["amenity"="clinic"]["name"~"бемор|больниц|госпитал|hospital|шифохон|ёрии|роддом",i](area.a););out center tags;',
FB=[['Душанбе','Dushanbe',38.5598,68.787],['Хуҷанд','Khujand',40.2826,69.622],['Истаравшан','Istaravshan',39.9143,69.002],['Панҷакент','Panjakent',39.495,67.609],['Исфара','Isfara',40.127,70.627],['Конибодом','Konibodom',40.289,70.43],['Қайроққум','Kayrakkum',40.2833,69.8],['Айнӣ','Ayni',39.383,68.533],['Бохтар','Bokhtar',37.8362,68.7808],['Кӯлоб','Kulob',37.9145,69.7845],['Норак','Norak',38.383,69.317],['Данғара','Danghara',38.09,69.33],['Фархор','Farkhor',37.49,69.4],['Ёвон','Yovon',38.32,69.02],['Ховалинг','Khovaling',38.28,69.98],['Хоруғ','Khorugh',37.4893,71.553],['Мурғоб','Murghob',38.17,73.96],['Ишкошим','Ishkoshim',36.726,71.612],['Ванҷ','Vanj',38.37,71.45],['Қалъаи Хумб','Qalaikhumb',38.46,70.81],['Ваҳдат','Vahdat',38.556,69.022],['Ҳисор','Hisor',38.526,68.557],['Турсунзода','Tursunzoda',38.5115,68.2305],['Шаҳринав','Shahrinav',38.555,68.305],['Файзобод','Fayzobod',38.54,69.32],['Роғун','Roghun',38.696,69.75],['Рашт (Ғарм)','Rasht Gharm',39,70.38],['Тавилдара','Tavildara',38.69,70.42],['Ҷиргатол','Jirgatol',39.22,71.2]];
let HS=[],MK={},SEL,AM={},PL=[],seen={},buf={};
let map,LG,ME0,NM;
try{const B=L.latLngBounds(BB);map=L.map('map',{zoomControl:false}).fitBounds(B);LG=L.layerGroup().addTo(map);map.setMinZoom(map.getBoundsZoom(B));map.setMaxBounds(B.pad(.1));
 const tl=L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png',{subdomains:'abcd',maxZoom:19,attribution:'© OpenStreetMap © CARTO'}).addTo(map);
 tl.once('tileerror',()=>tl.setUrl('https://tile.openstreetmap.org/{z}/{x}/{y}.png'));
 fetch('https://nominatim.openstreetmap.org/search?country=Tajikistan&format=json&polygon_geojson=1&polygon_threshold=.004&limit=1').then(r=>r.json()).then(d=>{
  const g=d[0].geojson,H=(g.type=='Polygon'?[g.coordinates]:g.coordinates).map(p=>p[0].map(c=>[c[1],c[0]]));
  L.polygon([[[-85,-180],[-85,180],[85,180],[85,-180]],...H],{stroke:false,fillColor:'#e8ebf0',fillOpacity:1,interactive:false}).addTo(map);
  L.polygon(H,{color:'#b4232c',weight:2,fill:false,interactive:false}).addTo(map)}).catch(()=>0)
}catch(e){NM=1}
const W0=()=>NM?'Харита боргирӣ нашуд: файлро дар браузер (Chrome/Safari) кушоед, на дар дохили Claude. ':'';
const FBL=()=>FB.map((x,i)=>({id:'f'+i,n:'Бемористони марказии '+x[0],c:'Ҷойгиршавии тахминӣ',s:nrm('Бемористони марказии '+x[0]+' '+x[1]),ll:[x[2],x[3]]}));
function setH(a,src){HS=a;draw();ST(W0()+'Беморхонаҳо: '+a.length+' ('+src+'). Номи беморхона ё як ҳарф нависед ё дар харита пахш кунед.')}
function draw(){if(!LG)return;LG.clearLayers();MK={};HS.forEach(h=>MK[h.id]=L.circleMarker(h.ll,{radius:7,weight:2,color:'#fff',fillColor:'#b4232c',fillOpacity:1}).bindPopup('<b>'+esc(h.n)+'</b>'+(h.c?'<br>'+esc(h.c):'')+'<br><br><button class="btn" onclick="pick(\''+h.id+'\')">Ман дар ин ҷо кор мекунам</button>').addTo(LG))}
async function load(){ST('Беморхонаҳо боргирӣ мешаванд…');
 if(!HS.length){try{const c=J.parse(LS.mr_h2||'[]');if(c.length)setH(c,'захирашуда')}catch{}}
 if(!HS.length)setH(FBL(),'захиравӣ, ҷойгиршавӣ тахминӣ');
 for(const u of OVS){try{const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),30000),r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(QQ),signal:ac.signal});clearTimeout(tm);
  if(!r.ok)continue;const d=await r.json(),s={};
  (d.elements||[]).forEach(e=>{const t=e.tags||{},c=e.center||e;if(c.lat==null)return;const k=e.type[0]+e.id,city=t['addr:city']||t['addr:district']||t['addr:street']||'',n=t['name:tg']||t.name||t['name:ru']||t['name:en']||'Беморхона '+c.lat.toFixed(3)+', '+c.lon.toFixed(3);
   s[k]={id:k,n,c:city,s:nrm([n,t.name,t['name:ru'],t['name:en'],t['name:uz'],city].join(' ')),ll:[c.lat,c.lon]}});
  const a=Object.values(s);if(!a.length)continue;LS.mr_h2=J.stringify(a);return setH(a,'OpenStreetMap')}catch{}}
 ST(W0()+(HS[0]&&HS[0].id[0]=='f'?'Интернет ё OpenStreetMap дастнорас: рӯйхати захиравӣ (тахминӣ). ':'Интернет нест: рӯйхати захирашуда. ')+'Аз нав кӯшиш: ин ҷоро пахш кунед.')}
function sg(){const t=nrm($('q').value).split(/\s+/).filter(Boolean),t0=t[0]||'',r=HS.filter(h=>t.every(x=>h.s.includes(x))).sort((a,b)=>(nrm(a.n).startsWith(t0)?0:1)-(nrm(b.n).startsWith(t0)?0:1)||a.n.localeCompare(b.n));
 $('ls').innerHTML='<small>'+(r.length?'Ёфт шуд: '+r.length+(r.length>80?' (80 то нишон дода шуд)':''):'Чизе ёфт нашуд')+'</small>'+r.slice(0,80).map(h=>{const i=t0?nrm(h.n).indexOf(t0):-1;return '<div data-i="'+h.id+'">'+(i>=0?esc(h.n.slice(0,i))+'<mark>'+esc(h.n.slice(i,i+t0.length))+'</mark>'+esc(h.n.slice(i+t0.length)):esc(h.n))+(h.c?'<small>'+esc(h.c)+'</small>':'')+'</div>'}).join('')}
$('q').oninput=sg;$('q').onfocus=sg;
$('ls').onclick=e=>{const d=e.target.closest('[data-i]'),m=d&&MK[d.dataset.i];if(m){$('ls').innerHTML='';$('q').blur();map.once('moveend',()=>m.openPopup());map.flyTo(m.getLatLng(),14)}};
function loc(){if(!navigator.geolocation)return ST('GPS дар ин дастгоҳ нест');ST('GPS ҷустуҷӯ мешавад…');
 navigator.geolocation.getCurrentPosition(p=>{const c=[p.coords.latitude,p.coords.longitude];ME0=ME0||L.circleMarker(c,{radius:9,weight:3,color:'#fff',fillColor:'#1d6fd8',fillOpacity:1}).addTo(map);ME0.setLatLng(c);map.flyTo(c,13);ST('Мавқеи шумо: '+c[0].toFixed(4)+', '+c[1].toFixed(4))},()=>ST('GPS иҷозат нест. Ба браузер иҷозат диҳед (дар телефон HTTPS лозим аст).'),{enableHighAccuracy:true,timeout:15000})}
$('st').onclick=load;load();
function pick(id){SEL=HS.find(h=>h.id==id);map.closePopup();map.removeLayer(LG);$('t1').hidden=1;$('t2').hidden=0;$('sh').hidden=0;$('hn').textContent=SEL.n;
 map.setMaxBounds(null);map.setMinZoom(6);L.marker(SEL.ll,{icon:L.divIcon({className:'',html:'<div class="hx">+</div>',iconSize:[34,34]})}).addTo(map);map.flyTo(SEL.ll,16);sub();la();lp()}
$('bk').onclick=()=>location.reload();$('al').onclick=()=>$('al').hidden=1;
function sub(){try{new BroadcastChannel('mrtj').onmessage=e=>on(e.data)}catch{}
 const es=new EventSource('https://ntfy.sh/mrtj-'+SEL.id+'/sse?since=10m');
 es.onopen=()=>$('hs').textContent='Пайваст · интизори мошинҳо';es.onerror=()=>$('hs').textContent='Алоқа қатъ шуд, аз нав пайваст мешавад…';
 es.onmessage=e=>{try{const d=J.parse(e.data);if(d.event!='message')return;const m=J.parse(d.message),b=buf[m.id]=buf[m.id]||[];b[m.i]=m.p;
  if(b.filter(x=>x!=null).length==m.n){delete buf[m.id];on(J.parse(b.join('')))}}catch{}}}
const ic=n=>L.divIcon({className:'',html:'<div class="am"><b>+</b>'+esc(n)+'</div>',iconSize:null});
function on(o){if(!o||!SEL||o.h!=SEL.id||seen[o.mid])return;seen[o.mid]=1;
 if(o.t=='pos'){const k=o.w.veh||o.w.name,a=AM[k]=AM[k]||{};if(a.ts>o.ts)return;Object.assign(a,o);const p=[o.lat,o.lng];
  a.m=a.m||L.marker(p,{icon:ic(o.w.name)}).addTo(map);a.l=a.l||L.polyline([p,SEL.ll],{color:'#b4232c',weight:3,dashArray:'6 8'}).addTo(map);
  a.m.setLatLng(p).setIcon(ic(o.w.name));a.l.setLatLngs([p,SEL.ll]);la()}
 else if(o.t=='pt'){o.c=[];PL.unshift(o);lp();$('al').hidden=0;$('al').textContent='Бемори нав: '+((o.bz||[]).join(', ')||o.inj||'—')+' · '+o.w.name;navigator.vibrate&&navigator.vibrate([200,100,200])}}
function la(){$('am').innerHTML=Object.values(AM).map(a=>{const d=km(a.lat,a.lng,SEL.ll[0],SEL.ll[1]);return '<div class="r"><b>'+esc(a.w.name)+'</b><small>'+esc(a.w.role)+' · '+esc(a.w.veh||'—')+' · '+esc(a.w.ph||'')+'</small>'+d.toFixed(1)+' км · тақрибан '+Math.max(1,Math.round(d*1.5))+' дақиқа'+(Date.now()-a.ts>60000?' · сигнал кӯҳна':'')+'</div>'}).join('')||'<span class="mu">Мошини ёрии таъҷилӣ дар хат нест.</span>'}
function lp(){$('pl').innerHTML=PL.map((p,i)=>'<div class="pc"><b>Бемори нав · '+new Date(p.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+'</b><small>Аз: '+esc(p.w.name)+' · '+esc(p.w.veh||'—')+'</small><div class="g"><div><small>Фишори хун</small><b>'+esc(p.bp)+'</b></div><div><small>Набз</small><b>'+esc(p.pl)+'</b></div><div><small>Ҳушёрӣ</small><b>'+esc(p.aw)+'</b></div><div><small>Нафаскашӣ</small><b>'+esc(p.br)+'</b></div></div><small>Ҷароҳат</small><b>'+esc((p.bz||[]).join(', ')||'—')+(p.inj?' · '+esc(p.inj):'')+'</b>'+(p.img&&p.img.startsWith('data:image/')?'<img src="'+esc(p.img)+'">':'')+['Утоқи ҷарроҳӣ','Таҷҳизот','Мутахассис','Хуни зарурӣ'].map((x,j)=>'<label class="ck"><input type="checkbox" data-i="'+i+'" data-j="'+j+'"'+(p.c[j]?' checked':'')+'>'+x+' омода аст</label>').join('')+'</div>').join('')||'<span class="mu">Ҳоло маълумот нест.</span>'}
$('pl').onchange=e=>{PL[e.target.dataset.i].c[e.target.dataset.j]=e.target.checked};
setInterval(()=>SEL&&la(),15000);
</script></body></html>
